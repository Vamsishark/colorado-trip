<!doctype html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Colorado Trip</title>
<script src='https://unpkg.com/react@18/umd/react.production.min.js'></script><script src='https://unpkg.com/react-dom@18/umd/react-dom.production.min.js'></script><script src='https://unpkg.com/@babel/standalone/babel.min.js'></script>
<style>body{margin:0;background:#f5f2e9;color:#173126;font-family:Inter,Arial,sans-serif}*{box-sizing:border-box}.hero{background:#183e30;color:white;padding:32px 5vw}.hero h1{font-family:Georgia,serif;font-size:46px;margin:0 0 8px}.app{max-width:1250px;margin:auto;padding:24px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav button{border:1px solid #d8d5cc;background:#fff;padding:10px 14px;border-radius:12px;font-weight:700;cursor:pointer}.nav .on{background:#d66f2c;color:#fff}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.card{background:white;border:1px solid #dfdcd3;border-radius:18px;padding:18px;box-shadow:0 8px 24px #0000000d}.map{position:relative;background:linear-gradient(145deg,#dce8d3,#eef0df);min-height:510px;overflow:hidden}.map:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 25% 65%,#b9caa9 0 8%,transparent 9%),radial-gradient(circle at 48% 40%,#c8d5b9 0 10%,transparent 11%),radial-gradient(circle at 75% 25%,#afc6a8 0 9%,transparent 10%);opacity:.65}.route{position:absolute;inset:20px}.pin{position:absolute;transform:translate(-50%,-50%);z-index:3}.pin i{display:block;width:16px;height:16px;background:#d66f2c;border:3px solid white;border-radius:50%;box-shadow:0 2px 8px #0005;margin:auto}.pin b{display:block;background:#fff;padding:5px 8px;border-radius:8px;white-space:nowrap;font-size:12px;box-shadow:0 2px 8px #0002;margin-top:4px}.road{position:absolute;height:5px;background:#d66f2c;transform-origin:left center;border-radius:9px;z-index:2}.timeline{display:grid;gap:8px}.row{display:grid;grid-template-columns:85px 1fr;padding:11px 0;border-bottom:1px solid #eee}.time{font-weight:800;color:#d66f2c}.muted{color:#68766f;font-size:13px;line-height:1.5}.pill{display:inline-block;padding:5px 8px;background:#edf3ee;border-radius:99px;font-size:11px;font-weight:700;margin:3px}.rest{padding:13px 0;border-bottom:1px solid #eee}.rest h3{margin:0 0 4px;font-size:15px}.rest a{color:#176348;text-decoration:none;font-weight:700}.warn{background:#fff3df;border:1px solid #eed3a8;border-radius:12px;padding:12px;margin:9px 0;font-size:13px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photo{background:#eef1e7;border-radius:13px;padding:14px;min-height:110px}.photo b{display:block;margin-bottom:6px}.links a{display:inline-block;margin:5px 5px 0 0;padding:8px 10px;border-radius:9px;background:#214e3b;color:#fff;text-decoration:none;font-size:12px;font-weight:700}@media(max-width:850px){.grid{grid-template-columns:1fr}.photos{grid-template-columns:1fr}.hero h1{font-size:36px}.map{min-height:420px}}</style></head><body><div id='root'></div>
<script type='text/babel'>
const D=[
{n:'Day 1 · Oct 9',title:'Denver → Independence Pass → Aspen → Maroon Bells',steps:[['6:00','Leave Denver','Use I-70 → CO-91 → Leadville → US-24 → Twin Lakes.'],['8:15','Twin Lakes','20–30 min photo/stretch stop.'],['9:15','Independence Pass','12,095 ft. Summit overlook; cold/windy even when Denver is mild.'],['11:30','Aspen','Lunch + hotel/luggage.'],['1:00–4:30','Maroon Bells','Maroon Lake + easy viewpoints. Build the afternoon around your shuttle slot.'],['Evening','Aspen','Downtown walk, dinner, sleep in Aspen.']]},
{n:'Day 2 · Oct 10',title:'Aspen → Glenwood Springs → Vail → Denver',steps:[['8:00','Leave Aspen','CO-82 north.'],['9:00–12:00','Glenwood Hot Springs','Relax rather than hike today.'],['12:15','Lunch','Indian option available right in Glenwood.'],['1:15','Glenwood Canyon','Scenic I-70 drive; use legal pull-offs/rest areas only.'],['2:30–4:30','Vail','Village + Gore Creek. Indian/Nepali option nearby if desired.'],['4:30','Denver','Drive east and sleep in Denver.']]},
{n:'Day 3 · Oct 11',title:'Denver → RMNP → Estes Park → Denver',steps:[['5:45','Leave Denver','Early departure.'],['7:30','Bear Lake','Timed Entry + Bear Lake Road required during controlled hours.'],['Morning','Lake hike','Bear → Nymph → Dream; Emerald only if conditions/energy are good.'],['Midday','Wildlife','Elk/meadow viewing from a safe distance.'],['1:00','Estes Park','Lunch. Excellent Indian/Nepali choices here.'],['5:00','Denver','Return; sleep near DEN for 10 AM flight.']]}
];
const food={Aspen:[['White House Tavern','American · $$','Reliable casual Aspen dinner; crispy chicken/French dip.'],['French Alpine Bistro','French/Alpine · $$$','Cozy mountain atmosphere; fondue/crêpes.'],['Mawa’s Kitchen','Global/African-inspired · $$','Distinctive local option near Aspen airport.']],Glenwood:[['Masala & Curry','Indian/Nepali · $$','Best fit for your Indian-food request: curries, momos, thali.'],['The Pullman','New American · $$','Popular downtown choice if you want something non-Indian.']],Vail:[['Annapurna Nepali & Indian Cuisine','Indian/Nepali · $$','Curries, tandoor dishes and momos inside Evergreen Lodge.']],Estes:[['Himalayan Curry & Kebob','Indian/Nepali · $$','Very convenient downtown post-RMNP lunch.'],['Indian Bites Estes Park','Indian/Nepali · $','Casual, customizable spice, good post-hike option.'],['Bird & Jim','Colorado cuisine · $$','Non-Indian alternative with mountain views.']],Denver:[['India Express Denver','Indian · $$','Strong Indian option if you eat in central Denver.'],['Spice Room','Indian/Nepali · $$','Broad North Indian + Indo-Chinese menu.'],['Root Down at DEN','New American · $$','Useful flight-day option inside Concourse C.']]};
const pos=[['Denver',83,67],['Twin Lakes',47,70],['Independence Pass',39,61],['Aspen',31,64],['Maroon Bells',28,75],['Glenwood',18,47],['Vail',52,48],['Estes Park',78,22],['RMNP',68,16]];
function Map(){return <div className='card map'><div className='route'>{pos.map((p,i)=><div className='pin' key={p[0]} style={{left:p[1]+'%',top:p[2]+'%'}}><i/><b>{p[0]}</b></div>)}<svg style={{position:'absolute',inset:0,width:'100%',height:'100%',zIndex:1}} viewBox='0 0 100 100' preserveAspectRatio='none'><polyline points='83,67 47,70 39,61 31,64 28,75' fill='none' stroke='#d66f2c' strokeWidth='1.2'/><polyline points='28,75 31,64 18,47 52,48 83,67' fill='none' stroke='#2f7253' strokeWidth='1.2'/><polyline points='83,67 78,22 68,16 78,22 83,67' fill='none' stroke='#4778b8' strokeWidth='1.2'/></svg></div><div style={{position:'absolute',bottom:16,left:18,zIndex:5}}><span className='pill'>Orange · Day 1</span><span className='pill'>Green · Day 2</span><span className='pill'>Blue · Day 3</span></div></div>}
function App(){const [day,setDay]=React.useState(0);const [city,setCity]=React.useState('Aspen');return <><header className='hero'><h1>Colorado Fall Road Trip</h1><div>Oct 9–11, 2026 · scenic drives · hot springs · alpine lakes · food stops</div></header><main className='app'><div className='grid'><Map/><div className='card'><div className='nav'>{D.map((x,i)=><button className={day===i?'on':''} onClick={()=>setDay(i)}>{x.n}</button>)}</div><h2>{D[day].title}</h2><div className='timeline'>{D[day].steps.map(s=><div className='row'><div className='time'>{s[0]}</div><div><b>{s[1]}</b><div className='muted'>{s[2]}</div></div></div>)}</div></div></div>
<div className='grid' style={{marginTop:18}}><div className='card'><h2>🍛 Food along the route</h2><div className='nav'>{Object.keys(food).map(c=><button className={city===c?'on':''} onClick={()=>setCity(c)}>{c}</button>)}</div>{food[city].map(r=><div className='rest'><h3>{r[0]}</h3><span className='pill'>{r[1]}</span><div className='muted'>{r[2]}</div><a target='_blank' href={'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(r[0]+' '+city+' Colorado')}>Open in Google Maps ↗</a></div>)}</div><div className='card'><h2>🏨 Stay strategy</h2><div className='rest'><h3>Oct 9 · Aspen</h3><div className='muted'>Stay downtown if budget allows. It makes the evening walkable and avoids another drive after Maroon Bells.</div></div><div className='rest'><h3>Oct 10 · Denver north/west side</h3><div className='muted'>Better positioning for the early RMNP departure than staying south of downtown.</div></div><div className='rest'><h3>Oct 11 · DEN / Peña Station</h3><div className='muted'>Prioritize airport access for your 10 AM flight, especially with rental-car return.</div></div><div className='warn'><b>Independence Pass fallback:</b> if weather closes CO-82 over the pass, use I-70 → Glenwood Springs → Aspen and keep the rest of the trip intact.</div></div></div>
<div className='card' style={{marginTop:18}}><h2>📸 Scenic & photo checklist</h2><div className='photos'><div className='photo'><b>Twin Lakes</b><span className='muted'>Lake foreground + Sawatch Range. Quick stop, not a hike.</span></div><div className='photo'><b>Independence Pass</b><span className='muted'>Continental Divide summit and alpine panorama.</span></div><div className='photo'><b>Maroon Lake</b><span className='muted'>Classic Bells composition; explore beyond the busiest shoreline angle.</span></div><div className='photo'><b>Glenwood Canyon</b><span className='muted'>Colorado River + canyon walls from designated stopping areas.</span></div><div className='photo'><b>Vail + Gore Creek</b><span className='muted'>Village architecture, creek and bridges.</span></div><div className='photo'><b>Dream Lake</b><span className='muted'>One of the strongest landscape stops on the trip; mountain backdrop over the lake.</span></div></div></div>
<div className='card links' style={{marginTop:18}}><h2>🎟 Reservations & live checks</h2><a target='_blank' href='https://www.visitmaroonbells.com/'>Maroon Bells</a><a target='_blank' href='https://www.recreation.gov/timed-entry/10086910'>RMNP timed entry</a><a target='_blank' href='https://www.cotrip.org/'>COtrip road status</a><a target='_blank' href='https://hotspringspool.com/'>Glenwood Hot Springs</a><p className='muted'>This version intentionally uses a schematic trip map plus direct Google Maps links for navigation. That avoids the broken/misleading basemap behavior from the previous prototype; use Google Maps for turn-by-turn driving.</p></div></main></>};ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
